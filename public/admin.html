<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIBI Admin - Panel de Leads</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Maven+Pro:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-header">
        <div class="logo"><img src="/images/logo.png" alt="SIBI"></div>
        <p>Panel de Administración</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" required placeholder="admin@sibi.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Iniciar sesión</button>
        <p id="loginError" class="login-error" style="display:none;"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="dashboard" style="display:none;">
    <nav class="admin-nav">
      <div class="admin-nav-content">
        <div class="logo"><img src="/images/logo.png" alt="SIBI"> <span class="admin-badge">Admin</span></div>
        <div class="admin-nav-right">
          <a href="/" class="admin-link">Ver Landing</a>
          <button id="logoutBtn" class="btn-logout">Cerrar sesión</button>
        </div>
      </div>
    </nav>

    <div class="admin-container">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="totalLeads">0</div>
          <div class="stat-label">Total Leads</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="todayLeads">0</div>
          <div class="stat-label">Hoy</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="weekLeads">0</div>
          <div class="stat-label">Esta semana</div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions-bar">
        <h2>Leads capturados</h2>
        <div class="actions-right">
          <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre o email...">
          <button id="exportBtn" class="btn btn-outline">Exportar CSV</button>
          <button id="refreshBtn" class="btn btn-outline">Actualizar</button>
        </div>
      </div>

      <!-- Table -->
      <div class="table-wrapper">
        <table class="leads-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Negocio</th>
              <th>Mensaje</th>
              <th>Fecha</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="leadsBody">
            <tr>
              <td colspan="8" class="empty-state">Cargando leads...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
